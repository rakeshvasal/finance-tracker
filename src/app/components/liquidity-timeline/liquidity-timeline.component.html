<div class="space-y-8">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">Liquidity Timeline</h1>
        <p class="text-sm text-slate-500 mt-1">90-day forecast of inflows and outflows.</p>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
        <div class="relative pl-8 sm:pl-32 py-6 border-l-2 border-slate-200">
            <div *ngFor="let event of timelineEvents()" class="relative mb-8 last:mb-0">
                <div class="absolute w-4 h-4 rounded-full border-4 border-white shadow -left-[9px] sm:-left-[125px] top-1"
                    [ngClass]="event.isIncoming ? 'bg-emerald-500' : 'bg-slate-400'"></div>
                <div class="hidden sm:block absolute -left-[110px] w-24 text-right">
                    <span class="text-sm font-bold block">{{ event.date | date:'MMM dd' }}</span>
                    <span class="text-xs text-slate-500">{{ event.daysUntil }} days</span>
                </div>
                <div
                    class="bg-slate-50 border border-slate-100 rounded-xl p-4 flex flex-col sm:flex-row items-baseline sm:items-center justify-between gap-2 shadow-sm">
                    <div>
                        <h4 class="text-base font-bold text-slate-800">{{ event.title }}</h4>
                        <p class="text-xs text-slate-500 uppercase">{{ event.type }}</p>
                    </div>
                    <div class="text-lg font-bold" [ngClass]="event.isIncoming ? 'text-emerald-600' : 'text-slate-800'">
                        {{ event.isIncoming ? '+' : '-' }}{{ event.amount | currency:'INR':'symbol':'1.0-0' }}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
